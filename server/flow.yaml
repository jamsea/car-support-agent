# Front desk flow for the car rental support agent.
#
#   greeting -> card_check -> card_policy
#
# transfer_to_human is a global function, so every node can go to `transfer`.
initial_node: greeting

nodes:
  greeting:
    role_message: >
      You are a phone support agent for an Australian car rental company. The
      caller is standing at the front desk of one of our stores. Speak
      Australian English and use Australian spelling. Your replies are spoken
      aloud, so keep them to one or two short sentences, with no emojis, lists
      or special characters. Stay calm and polite, even if the caller is upset.
      If the caller ever asks for a person, a human, a manager or a transfer,
      call transfer_to_human straight away and say nothing yourself.
    task_messages:
      - role: developer
        content: >
          Greet the caller briefly and ask how you can help. As soon as they
          say they are not being given their rental car, or ask why they
          can't get it, call report_rental_refused. Do not try to answer or
          look into it yourself.
    functions:
      - name: report_rental_refused
        transition_only: true
        description: >
          The caller is at the front desk and is not being given their rental
          car, or is asking why they can't get it.
        transition_to: card_check

  card_check:
    task_messages:
      - role: developer
        content: >
          Ask the caller if they brought a physical card with them today. Ask
          only that. When they answer, call record_card_answer.
    functions:
      - name: record_card_answer
        transition_to: card_policy

  card_policy:
    task_messages:
      - role: developer
        content: >
          Look at the has_card result. If the caller did not bring a physical
          card, explain that they need to provide a physical card to get a
          rental car, so the desk cannot hand over the car without one. If
          they do have a physical card with them, tell them to show it to the
          staff at the front desk. Answer any follow-up questions briefly.

  transfer:
    task_messages:
      - role: developer
        content: The caller is being transferred. Say nothing.
    respond_immediately: false
    pre_actions:
      - type: end_conversation
        text: One moment, I'll transfer you now.

global_functions:
  - name: transfer_to_human
    transition_only: true
    description: >
      Transfer the caller to a human. Call this whenever the caller asks to
      speak to a person, a human or a manager, or asks to be transferred. Do
      not say anything yourself, just call this function.
    transition_to: transfer
